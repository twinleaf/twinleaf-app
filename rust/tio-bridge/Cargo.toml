[package]
name = "tio-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "twinleaf_core"
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[features]
default = ["serial", "firmware", "mdns"]
serial = ["twinleaf/serial", "tio-dsp/serial"]
hdf5 = ["twinleaf/hdf5"]
# Firmware update support: lazy availability check + flashing, backed by the
# GitHub firmware catalog (pulls in an HTTP client + TLS via twinleaf).
firmware = ["twinleaf/firmware-update"]
# Network device discovery over mDNS/DNS-SD. Uses raw multicast sockets, which
# require the multicast networking entitlement on macOS/iOS. Enabled on macOS;
# omitted from the iOS build (that entitlement is approval-gated).
mdns = ["twinleaf/mdns"]

# The release profile (full debug info, packed .dSYM) is set in the workspace
# manifest, ../Cargo.toml.

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
twinleaf = { version = "2.0", path = "../../vendor/twinleaf-rust/twinleaf", default-features = false, features = ["processing"] }
# The signal graph: hosted in process when a session has a spec.
tio-dsp = { path = "../tio-dsp", default-features = false, features = ["serde"] }
