[package]
name = "labdsp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A worked example of a private DSP device: tiodsp with a function of its own."
publish = false

[lib]
name = "labdsp"
path = "src/lib.rs"

[[bin]]
name = "labdsp"
path = "src/main.rs"

[dependencies]
# All a private device links. The language, the checker, the engine, the
# device and the command line come from here; what is in this crate is the
# algorithm and nothing else.
tio-dsp = { path = "../../tio-dsp" }

[dev-dependencies]
# For the reply types a test reads back from the device.
twinleaf = { version = "2.0", path = "../../../vendor/twinleaf-rust/twinleaf", default-features = false }
